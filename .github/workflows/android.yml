name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare licensed weapon, terrain and recorded audio assets
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          bash tools/prepare_external_assets.sh

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot editor
        run: |
          curl -L --fail --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${{ env.GODOT_VERSION }}" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Cache Godot Android export templates
        id: godot-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-android-templates-v1

      - name: Install matching Android export templates
        if: steps.godot-template-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${{ env.GODOT_VERSION }}" -o templates.tpz
          mapfile -t android_templates < <(unzip -Z1 templates.tpz | grep -E '^templates/(android_debug\.apk|android_release\.apk|android_source\.zip)$')
          test "${#android_templates[@]}" -eq 3
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          unzip -q templates.tpz "${android_templates[@]}" -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/"

      - name: Configure Android SDK paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and parse project
        run: |
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Run headless scene smoke test
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/smoke_test.gd

      - name: Run headless battle test
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/battle_test.gd

      - name: Run headless content test
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/content_test.gd

      - name: Export Android debug APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/TacticalStrike-debug.apk
          test -s build/TacticalStrike-debug.apk
          test -s assets/runtime/weapon_manifest.json
          test -s assets/runtime/models/ak74m/scene.gltf
          test -s assets/runtime/models/ak74m/scene.bin
          test -s assets/runtime/models/ak74m/textures/arms_baseColor.jpg
          test -s assets/runtime/models/ak74m/textures/ak74m_baseColor.jpg
          test -s assets/runtime/audio/ak_C_27P.ogg
          test -s assets/runtime/audio/ak_C_36P.ogg
          test -s assets/runtime/audio/sand_l.ogg
          test -s assets/runtime/audio/sand_r.ogg
          test -s assets/runtime/terrain/rocky_gravel_diff_1k.jpg
          test -s assets/audio/weapons/ak_01.ogg
          test -s assets/audio/weapons/pkm_01.ogg
          test -s assets/audio/weapons/svd_01.ogg
          test -s assets/audio/weapons/50cal_01.ogg
          test -s assets/audio/weapons/rpg_launch.ogg
          test -s assets/audio/weapons/impact_flesh.ogg
          test -s assets/runtime/materials/brick_color.jpg
          test -s assets/runtime/materials/wood_color.jpg

      - name: Validate APK archive, signature and ARM64 payload
        run: |
          set -euo pipefail
          unzip -t build/TacticalStrike-debug.apk > build/apk-zip-validation.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/TacticalStrike-debug.apk > build/apk-signature-validation.txt 2>&1
          unzip -Z1 build/TacticalStrike-debug.apk > build/apk-entries.txt
          grep -Fxq "AndroidManifest.xml" build/apk-entries.txt
          grep -Fxq "classes.dex" build/apk-entries.txt
          grep -Fxq "lib/arm64-v8a/libgodot_android.so" build/apk-entries.txt
          sha256sum build/TacticalStrike-debug.apk > build/TacticalStrike-debug.apk.sha256
          {
            echo "Tactical Strike Android APK validation"
            echo "APK size: $(stat -c '%s bytes' build/TacticalStrike-debug.apk)"
            echo "APK SHA-256:"
            cat build/TacticalStrike-debug.apk.sha256
            echo "Archive integrity: PASS"
            echo "APK signature: PASS"
            echo "AndroidManifest.xml: PASS"
            echo "classes.dex: PASS"
            echo "ARM64 native library: PASS"
          } > build/apk-validation.txt

      - name: Upload verified Android APK and integrity report
        uses: actions/upload-artifact@v7
        with:
          name: TacticalStrike-Android-verified
          path: |
            build/TacticalStrike-debug.apk
            build/TacticalStrike-debug.apk.sha256
            build/apk-validation.txt
          compression-level: 9
          if-no-files-found: error
          retention-days: 14
